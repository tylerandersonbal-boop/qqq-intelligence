name: Daily development review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Review saved market data
        run: python scripts/development_review.py
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-development-review
          path: development-review.md
          retention-days: 14
