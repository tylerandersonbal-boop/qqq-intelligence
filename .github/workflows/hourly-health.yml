name: Hourly QQQ health check
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check monitor runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, datetime, sys
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/workflows/monitor.yml/runs?per_page=20"
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'User-Agent':'qqq-health-check'})
          with urllib.request.urlopen(req, timeout=20) as response:
              runs = json.load(response)['workflow_runs']
          completed = [r for r in runs if r['status'] == 'completed']
          if not completed:
              sys.exit('No completed monitor runs found')
          latest = completed[0]
          age = datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(latest['created_at'].replace('Z','+00:00'))
          print('Latest completed monitor:', latest['html_url'], latest['conclusion'], 'age:', age)
          if latest['conclusion'] != 'success':
              sys.exit('Latest completed monitor failed')
          if age > datetime.timedelta(hours=2):
              sys.exit('Monitor has no completed run in over two hours')
          PY
